apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stable ConfigMap names: the Helm values reference them by name.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: headlamp-stack-config
    namespace: oauth2-proxy
    envs:
      - stack.env

resources:
  # Generated by scripts/seal-secrets.sh -- must exist (and be committed)
  # before Argo can sync this app.
  - oauth2-proxy-credentials.sealedsecret.yaml
  - traefik-tailscale-ingress.yaml
  - oauth2-forwardauth.yaml
  - headlamp-ingress.yaml

# Argo can't template from a ConfigMap at runtime, so kustomize does it at
# render time: hostnames in the manifests below are overwritten from stack.env.
# (The literal hostnames in the YAML files are just defaults/documentation.)
replacements:
  - source:
      kind: ConfigMap
      name: headlamp-stack-config
      fieldPath: data.APP_HOST
    targets:
      - select: {kind: Ingress, name: headlamp}
        fieldPaths: [spec.rules.0.host]
      - select: {kind: Ingress, name: headlamp-oauth2}
        fieldPaths: [spec.rules.0.host]
      - select: {kind: Middleware, name: auth-headers}
        fieldPaths: [spec.headers.sslHost]
  - source:
      kind: ConfigMap
      name: headlamp-stack-config
      fieldPath: data.TS_HOSTNAME
    targets:
      - select: {kind: Ingress, name: traefik-tailscale}
        fieldPaths: [spec.tls.0.hosts.0]
