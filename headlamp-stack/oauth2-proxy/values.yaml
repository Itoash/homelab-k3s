config:
  configFile: ""
  # Use our SealedSecret directly instead of extraEnv, so the chart's own
  # generated env vars (OAUTH2_PROXY_CLIENT_SECRET/COOKIE_SECRET) point here
  # and we avoid duplicate env entries causing Argo CD merge-patch conflicts.
  existingSecret: oauth2-proxy-credentials
  requiredSecretKeys:
    - client-secret
    - cookie-secret

alphaConfig:
  enabled: true

  configData:
    server:
      BindAddress: "0.0.0.0:4180"

    injectRequestHeaders: []

    injectResponseHeaders:
      - name: Authorization
        values:
          - claimSource:
              claim: access_token
              prefix: "Bearer "

      - name: X-Forwarded-User
        values:
          - claimSource:
              claim: user

      - name: X-Forwarded-Email
        values:
          - claimSource:
              claim: email

    upstreamConfig:
      upstreams:
        - id: headlamp
          path: /
          uri: http://headlamp.headlamp.svc.cluster.local:80

    providers:
      - id: github
        provider: github
        clientID: "Ov23livxDLXXajPOIG6w"
        clientSecret: "${OAUTH2_PROXY_CLIENT_SECRET}"
        scope: "user:email read:org"

        githubConfig:
          users:
            - "Itoash"

    cookie:
      secret: "${OAUTH2_PROXY_COOKIE_SECRET}"
      domain: "headlamp.tail3aac60.ts.net"
      secure: true
      samesite: "lax"