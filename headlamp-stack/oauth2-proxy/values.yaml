config:
  configFile: ""

extraEnv:
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: oauth2-proxy-credentials
        key: client-secret

  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: oauth2-proxy-credentials
        key: cookie-secret

alphaConfig:
  enabled: true

  configData:
    server:
      BindAddress: "0.0.0.0:4180"

    injectRequestHeaders: []

    injectResponseHeaders:
      - name: Authorization
        values:
          - claimSource:
              claim: access_token
              prefix: "Bearer "

      - name: X-Forwarded-User
        values:
          - claimSource:
              claim: user

      - name: X-Forwarded-Email
        values:
          - claimSource:
              claim: email

    upstreamConfig:
      upstreams:
        - id: headlamp
          path: /
          uri: http://headlamp.headlamp.svc.cluster.local:80

    providers:
      - id: github
        provider: github
        clientID: "Ov23livxDLXXajPOIG6w"
        clientSecret: "${OAUTH2_PROXY_CLIENT_SECRET}"
        scope: "user:email read:org"

        githubConfig:
          users:
            - "Itoash"

    cookie:
      secret: "${OAUTH2_PROXY_COOKIE_SECRET}"
      domain: "headlamp.tail3aac60.ts.net"
      secure: true
      samesite: "lax"