# oauth2-proxy as a ForwardAuth backend for Traefik (see manifests/).
#
# Where things live:
#   secrets   -> Secret "oauth2-proxy-credentials" (SealedSecret, from secrets.env)
#                  cookie-secret  -> env OAUTH2_PROXY_COOKIE_SECRET (chart wires this)
#                  client-secret  -> file, read via providers[].clientSecretFile
#   host/URLs -> ConfigMap "headlamp-stack-config"  (manifests/stack.env)
#   users, client ID, headers -> ConfigMap "oauth2-proxy-alpha" (manifests/oauth2-proxy-alpha.yaml)
#   static flags -> below

config:
  existingSecret: oauth2-proxy-credentials
  # Only cookie-secret is injected as an env var. The GitHub client ID/secret
  # come from the alpha config: alpha `providers` REPLACES the legacy provider
  # options, so OAUTH2_PROXY_CLIENT_ID/SECRET would be ignored anyway.
  requiredSecretKeys:
    - cookie-secret
  # No configFile: the chart generates a minimal legacy cfg (email_domains = ["*"];
  # access is restricted by githubConfig.users in the alpha config instead).

alphaConfig:
  enabled: true
  existingConfig: oauth2-proxy-alpha   # ConfigMap key: oauth2_proxy.yml

# Host-derived settings come from the shared ConfigMap so a tailnet rename is a
# one-line change in manifests/stack.env. $(VAR) is expanded by Kubernetes from
# the env entries defined above it.
extraEnv:
  - name: STACK_HOST
    valueFrom:
      configMapKeyRef:
        name: headlamp-stack-config
        key: APP_HOST
  - name: OAUTH2_PROXY_REDIRECT_URL
    value: "https://$(STACK_HOST)/oauth2/callback"
  - name: OAUTH2_PROXY_COOKIE_DOMAINS
    value: "$(STACK_HOST)"
  - name: OAUTH2_PROXY_WHITELIST_DOMAINS
    value: "$(STACK_HOST)"

extraArgs:
  reverse-proxy: "true"
  cookie-secure: "true"
  cookie-samesite: "lax"

# Mount the client secret as a file for clientSecretFile.
# (Not /etc/oauth2-proxy: the chart uses that path for its optional emails file.)
extraVolumes:
  - name: credentials
    secret:
      secretName: oauth2-proxy-credentials
      items:
        - key: client-secret
          path: client-secret
extraVolumeMounts:
  - name: credentials
    mountPath: /etc/oauth2-proxy-credentials
    readOnly: true
